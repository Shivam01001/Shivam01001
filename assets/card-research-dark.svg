  <text x="20" y="38" font-size="20" font-weight="700" fill="#00ff00"><tspan fill="#00a000">▸ </tspan>Research</text>
  <rect x="345.2" y="22" width="44.8" height="22" fill="#003300" stroke="#008000"/>
  <text x="367.6" y="37.5" font-size="12" fill="#00ff00" text-anchor="middle">NEXT</text>
  <text x="20" y="62" font-size="12.5" fill="#00a000">Red teaming, reverse engineering</text>
  <text x="20" y="79" font-size="12.5" fill="#00a000">binary exploitation and LLM security.</text>
  <text x="20" y="112" font-size="19" font-weight="700" fill="#00ff00">SYS</text>
  <text x="20" y="130" font-size="11" fill="#00a000">security</text>
  <text x="143.33333333333331" y="112" font-size="19" font-weight="700" fill="#00ff00">LLM</text>
  <text x="143.33333333333331" y="130" font-size="11" fill="#00a000">security</text>
  <text x="20" y="114" font-size="12.5" fill="#00a000">ask›</text>
  <text x="57.5" y="114" font-size="12.5" fill="#00ff00" textLength="187.5" lengthAdjust="spacing">what assumption can fail?</text>
  <rect class="typing motion-only" x="57.5" y="98" width="197.5" height="24" fill="#0d0d0d"/>
