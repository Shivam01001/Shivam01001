<svg xmlns="http://www.w3.org/2000/svg" width="422" height="232" viewBox="0 0 422 232" role="img" aria-labelledby="title">
<title id="title">InboxEye PYTHON: Email-header forensics and phishing-signal investigation. SPF checks, DKIM checks, DMARC checks.</title>
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; white-space: pre; }
  @keyframes appear { from { opacity: 0; } }
  @keyframes type { from { transform: translateX(0); } to { transform: translateX(190px); } }
  .typing { animation: type 1.44s steps(24) .6s both; }
  .r1 { animation: appear .3s ease-out 2.34s both; }
  .r2 { animation: appear .3s ease-out 3.04s both; }
  @keyframes lock { 0% { opacity: 0; transform: scale(1.05); } 55% { opacity: 1; transform: scale(1); } 65% { opacity: .2; } 75% { opacity: 1; } 85% { opacity: .2; } 100% { opacity: 1; transform: scale(1); } }
  .lock { transform-box: view-box; transform-origin: 50% 50%; animation: lock .9s ease-out .1s both; }
  @media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .motion-only { display: none; }
}
</style>
<g transform="translate(6 6)">
  <rect width="410" height="220" fill="#f4fbf4"/>
  <text x="20" y="38" font-size="20" font-weight="700" fill="#0b5d1e"><tspan fill="#3f7a4f">▸ </tspan>InboxEye</text>
  <rect x="330.8" y="22" width="59.199999999999996" height="22" fill="#d3ebd3" stroke="#2e7d32"/>
  <text x="360.4" y="37.5" font-size="12" fill="#0b5d1e" text-anchor="middle">PYTHON</text>
  <text x="20" y="62" font-size="12.5" fill="#3f7a4f">Email-header forensics and</text>
  <text x="20" y="79" font-size="12.5" fill="#3f7a4f">phishing-signal investigation.</text>
  <text x="20" y="112" font-size="19" font-weight="700" fill="#0b5d1e">SPF</text>
  <text x="20" y="130" font-size="11" fill="#3f7a4f">checks</text>
  <text x="143.33333333333331" y="112" font-size="19" font-weight="700" fill="#0b5d1e">DKIM</text>
  <text x="143.33333333333331" y="130" font-size="11" fill="#3f7a4f">checks</text>
  <text x="266.66666666666663" y="112" font-size="19" font-weight="700" fill="#0b5d1e">DMARC</text>
  <text x="266.66666666666663" y="130" font-size="11" fill="#3f7a4f">checks</text>
  <text x="20" y="114" font-size="12.5" fill="#3f7a4f">ask›</text>
  <text x="57.5" y="114" font-size="12.5" fill="#0b5d1e" textLength="180" lengthAdjust="spacing">trace this message route</text>
  <rect class="typing motion-only" x="57.5" y="98" width="190" height="24" fill="#f4fbf4"/>
  <text class="r1" x="20" y="142" font-size="12.5" fill="#3f7a4f">  → <tspan fill="#006d77">headers → signals → evidence</tspan></text>
  <text class="r2" x="20" y="166" font-size="12.5" fill="#0b5d1e">  investigation ready</text>
  <text x="20" y="212" font-size="10.5" fill="#3f7a4f" opacity=".85">email forensics</text>
  <text x="390" y="212" font-size="10.5" fill="#3f7a4f" opacity=".85" text-anchor="end">GitHub</text>
</g>
<rect x="6" y="6" width="410" height="220" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
<path class="lock" d="M1.25 17.25 V1.25 H17.25 M404.75 1.25 H420.75 V17.25 M420.75 214.75 V230.75 H404.75 M17.25 230.75 H1.25 V214.75" fill="none" stroke="#0b5d1e" stroke-width="2.5" stroke-linecap="square"/>
</svg>
