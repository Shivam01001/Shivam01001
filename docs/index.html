<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071109">
    <meta name="description" content="Shivam's interactive security terminal demo.">
    <title>Shivam | Security Terminal</title>
    <style>
      :root { color-scheme: dark; --bg:#050907; --panel:#09110c; --line:#20ef5a; --muted:#72b987; --cyan:#00e5ff; --red:#ff5364; }
      * { box-sizing:border-box; } body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at top,#102516,var(--bg) 58%); color:var(--line); font:16px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .terminal { width:min(760px,100%); border:2px solid var(--line); box-shadow:0 0 0 5px #062e12,0 0 36px #1aff5c55; background:repeating-linear-gradient(0deg,#0000 0 3px,#ffffff05 3px 4px),var(--panel); }
      .bar { display:flex; justify-content:space-between; gap:10px; padding:10px 16px; border-bottom:1px solid #1a6f31; color:#8bdd9c; font-size:12px; letter-spacing:.08em; }.content { padding:clamp(22px,5vw,44px); }.eyebrow { color:var(--muted); margin:0 0 10px; } h1 { margin:0; font-size:clamp(32px,8vw,72px); line-height:1; letter-spacing:.06em; text-shadow:0 0 18px #20ef5a99; }.subtitle { color:var(--cyan); margin:16px 0 28px; }.notice { color:var(--muted); font-size:13px; margin:0 0 22px; }
      form { display:grid; gap:16px; } label { display:grid; gap:8px; color:#b5f7c2; font-size:13px; } input { width:100%; border:1px solid #36a856; border-radius:0; outline:0; padding:14px; color:#d7ffe0; background:#020603; font:inherit; } input:focus { border-color:var(--cyan); box-shadow:0 0 0 3px #00e5ff22; } input[readonly] { color:#8bdd9c; } button { width:max-content; border:1px solid var(--line); padding:12px 18px; cursor:pointer; background:#0d3919; color:#eaffed; font:inherit; font-weight:700; letter-spacing:.04em; } button:hover,button:focus-visible { background:#126b29; outline:2px solid var(--cyan); outline-offset:2px; }
      #result { min-height:72px; margin-top:26px; border-left:3px solid #2b6e3d; padding:14px 16px; background:#061008; color:#9ed5aa; white-space:pre-line; } #result.granted { border-color:var(--line); color:#d6ffe0; animation:granted .8s ease-out; } #result.denied { border-color:var(--red); color:#ffc1c7; animation:denied .42s linear; }.cursor { animation:blink 1s step-end infinite; } footer { margin-top:28px; color:#679b76; font-size:12px; } @keyframes blink { 50% { opacity:0; } } @keyframes granted { 50% { box-shadow:0 0 34px #20ef5a88; } } @keyframes denied { 25%,75% { transform:translateX(8px); } 50% { transform:translateX(-8px); } }
    </style>
  </head>
  <body>
    <main class="terminal" aria-labelledby="title"><header class="bar"><span>SHIVAM SECURITY LAB</span><span>DEMO MODE <span class="cursor">●</span></span></header><section class="content"><p class="eyebrow">$ ./open --interactive-terminal</p><h1 id="title">SHIVAM</h1><p class="subtitle">Cybersecurity · VAPT · Security Research</p><p class="notice">A harmless portfolio interaction — not a real login or authentication system.</p><form id="challenge"><label>USERNAME<input name="username" value="kali" readonly aria-readonly="true"></label><label>PASSWORD<input name="password" type="password" autocomplete="off" autofocus placeholder="enter password" required></label><button type="submit">AUTHENTICATE →</button></form><output id="result" aria-live="polite">Awaiting input…</output><footer>Authorized learning · responsible research · clear scope</footer></section></main>
    <script>
      const form=document.querySelector('#challenge'),password=form.elements.password,result=document.querySelector('#result');
      form.addEventListener('submit',(event)=>{event.preventDefault();result.className='';result.textContent='Verifying local demo credential…';window.setTimeout(()=>{if(password.value.trim().toLowerCase()==='kali'){result.className='granted';result.textContent="ACCESS GRANTED\nAverage hacker's Kali credential ;)";}else{result.className='denied';result.textContent='ACCESS DENIED\nHint: this is a harmless portfolio challenge.';}},650);});
    </script>
  </body>
</html>
